<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoStore - Tienda Tecnológica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📱🛒 NeoStore</h1>
            <p>Control de Inventario Tecnológico</p>
        </header>

        <main>
            <section class="card">
                <h2>Registrar Producto Tecnológico</h2>
                <form id="producto-form">
                    <input type="hidden" id="producto-id">
                    
                    <div class="form-group">
                        <label for="nombre">Nombre del Producto:</label>
                        <input type="text" id="nombre" placeholder="Ej: Laptop Gaming, Mouse Inalámbrico" required>
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio ($):</label>
                        <input type="number" id="precio" step="0.01" placeholder="Ej: 899.99" required>
                    </div>

                    <div class="form-group">
                        <label for="stock">Cantidad en Stock:</label>
                        <input type="number" id="stock" placeholder="Ej: 15" required>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoría:</label>
                        <select id="categoria" required>
                            <option value="">Seleccione una categoría</option>
                            <option value="Laptops">Laptops</option>
                            <option value="Smartphones">Smartphones</option>
                            <option value="Accesorios">Accesorios</option>
                            <option value="Componentes">Componentes</option>
                            <option value="Monitores">Monitores</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar Producto</button>
                </form>
            </section>

            <section class="card margin-top">
                <h2>Inventario de Productos</h2>
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <input type="text" id="input-buscar" placeholder="🔍 Buscar producto por nombre o categoría...">
                </div>

                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Categoría</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="lista-productos">
                            <tr>
                                <td colspan="6" style="text-align:center;">Cargando inventario...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
